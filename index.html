<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>اولین پروژه API</h1>
    <script>
        fetch("https://jsonplaceholder.typicode.com/posts")
        .then(function(value){
             return value.json()
        })
        .then(function(result){
            console.log(result)
        })
        //روش دوم
         fetch("https://jsonplaceholder.typicode.com/posts")
         .then(Response => Response.json())
         .then(data =>{
            console.log(data)
         })
    </script>
</body>
</html>
